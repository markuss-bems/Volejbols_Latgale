<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volejbola Spēle - Volleyball Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .controls-info {
            color: white;
            font-size: 1.1em;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 10px;
            max-width: 600px;
        }

        #gameCanvas {
            border: 3px solid white;
            background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%);
            cursor: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .stats {
            display: flex;
            gap: 40px;
            color: white;
            font-size: 1.5em;
            font-weight: bold;
        }

        .stat-item {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 30px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.7em;
            opacity: 0.8;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .button-row {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            padding: 12px 30px;
            font-size: 1em;
            background-color: #FFE656;
            color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #FFED4E;
        }

        button:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>⚽ Volejbola Spēle 🏐</h1>
        <div class="controls-info">
            <strong>Vadības:</strong><br>
            🖱️ Pārvietojiet peli lai vadītu raketi<br>
            🖱️ Klikšķis lai sāktu spēli
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Jūsu Punkti</div>
                <div id="playerScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Dators</div>
                <div id="computerScore">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Sitieni</div>
                <div id="hitCount">0</div>
            </div>
        </div>
        <div class="button-row">
            <button onclick="restartGame()">Sākt Jaunu Spēli</button>
            <button onclick="window.history.back()">Atpakaļ</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            radius: 12,
            vx: 0,
            vy: 0,
            speed: 5
        };

        const paddle = {
            x: canvas.width / 2 - 50,
            y: canvas.height - 30,
            width: 100,
            height: 15,
            speed: 7
        };

        const computer = {
            x: canvas.width / 2 - 50,
            y: 20,
            width: 100,
            height: 15,
            speed: 4
        };

        const net = {
            x: canvas.width / 2,
            y: canvas.height / 2
        };

        let playerScore = 0;
        let computerScore = 0;
        let hitCount = 0;
        let gameStarted = false;
        let mouseX = canvas.width / 2;
        let ballLastHitBy = null; // Track who last hit the ball

        // Event listeners
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
        });

        canvas.addEventListener('click', () => {
            if (!gameStarted) {
                startGame();
            }
        });

        function startGame() {
            gameStarted = true;
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 4;
            ball.vx = (Math.random() - 0.5) * 6;
            ball.vy = 5;
        }

        function restartGame() {
            playerScore = 0;
            computerScore = 0;
            hitCount = 0;
            gameStarted = false;
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.vx = 0;
            ball.vy = 0;
            ballLastHitBy = null;
            updateScore();
        }

        function updateScore() {
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;
            document.getElementById('hitCount').textContent = hitCount;
        }

        function update() {
            if (!gameStarted) return;

            // Update ball position
            ball.x += ball.vx;
            ball.y += ball.vy;
            ball.vy += 0.3; // Gravity

            // Ball collision with walls
            if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
                ball.vx *= -0.95;
                ball.x = Math.max(ball.radius, Math.min(canvas.width - ball.radius, ball.x));
            }

            // Ball collision with top/bottom
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy *= -0.8;
            }

            if (ball.y + ball.radius > canvas.height) {
                // Ball went past player paddle
                computerScore++;
                ballLastHitBy = null;
                resetBall();
                updateScore();
                return;
            }

            // Player paddle movement
            paddle.x = mouseX - paddle.width / 2;
            paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, paddle.x));

            // Ball collision with player paddle
            if (
                ball.y + ball.radius > paddle.y &&
                ball.y - ball.radius < paddle.y + paddle.height &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width &&
                ballLastHitBy !== 'player'
            ) {
                ball.vy = -Math.abs(ball.vy) * 0.9;
                ball.vx += (ball.x - (paddle.x + paddle.width / 2)) * 0.1;
                hitCount++;
                ballLastHitBy = 'player';
            }

            // Computer AI
            const computerTarget = ball.x;
            if (computerTarget < computer.x + computer.width / 2 - 10) {
                computer.x -= computer.speed;
            } else if (computerTarget > computer.x + computer.width / 2 + 10) {
                computer.x += computer.speed;
            }
            computer.x = Math.max(0, Math.min(canvas.width - computer.width, computer.x));

            // Ball collision with computer paddle
            if (
                ball.y - ball.radius < computer.y + computer.height &&
                ball.y + ball.radius > computer.y &&
                ball.x > computer.x &&
                ball.x < computer.x + computer.width &&
                ballLastHitBy !== 'computer'
            ) {
                ball.vy = Math.abs(ball.vy) * 0.9;
                ball.vx += (ball.x - (computer.x + computer.width / 2)) * 0.1;
                ballLastHitBy = 'computer';
            }

            // Ball went past computer paddle
            if (ball.y - ball.radius < 0) {
                playerScore++;
                ballLastHitBy = null;
                resetBall();
                updateScore();
            }

            // Speed limit
            const maxSpeed = 12;
            const speed = Math.sqrt(ball.vx ** 2 + ball.vy ** 2);
            if (speed > maxSpeed) {
                ball.vx = (ball.vx / speed) * maxSpeed;
                ball.vy = (ball.vy / speed) * maxSpeed;
            }
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.vx = (Math.random() - 0.5) * 4;
            ball.vy = -3;
        }

        function draw() {
            // Clear canvas with gradient background (sky and ground)
            const gradientBg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradientBg.addColorStop(0, '#87CEEB');
            gradientBg.addColorStop(0.4, '#E0F6FF');
            gradientBg.addColorStop(0.4, '#D4A574');
            gradientBg.addColorStop(1, '#C19A6B');
            ctx.fillStyle = gradientBg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw court background - two sides
            const courtTop = canvas.height / 2 - 80;
            const courtBottom = canvas.height / 2 + 80;
            
            // NPC Court (top side)
            ctx.fillStyle = 'rgba(200, 100, 100, 0.3)';
            ctx.fillRect(0, courtTop, canvas.width, 80);
            
            // Player Court (bottom side)
            ctx.fillStyle = 'rgba(100, 150, 200, 0.3)';
            ctx.fillRect(0, courtBottom, canvas.width, 80);

            // Draw court boundary lines
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            
            // Top court border
            ctx.beginPath();
            ctx.moveTo(0, courtTop);
            ctx.lineTo(canvas.width, courtTop);
            ctx.stroke();
            
            // Bottom court border
            ctx.beginPath();
            ctx.moveTo(0, courtBottom);
            ctx.lineTo(canvas.width, courtBottom);
            ctx.stroke();
            
            // Side lines
            ctx.beginPath();
            ctx.moveTo(20, courtTop);
            ctx.lineTo(20, courtBottom);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(canvas.width - 20, courtTop);
            ctx.lineTo(canvas.width - 20, courtBottom);
            ctx.stroke();

            // Draw attack lines
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2 - 40);
            ctx.lineTo(canvas.width, canvas.height / 2 - 40);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2 + 40);
            ctx.lineTo(canvas.width, canvas.height / 2 + 40);
            ctx.stroke();
            
            ctx.setLineDash([]);

            // Draw volleyball net - more realistic with mesh
            const netX = canvas.width / 2;
            const netTopY = canvas.height / 2 - 100;
            const netBottomY = canvas.height / 2 + 100;
            const netWidth = 15;
            
            // Net poles
            ctx.fillStyle = '#333333';
            ctx.fillRect(netX - netWidth / 2 - 8, netTopY - 30, 8, 130);
            ctx.fillRect(netX + netWidth / 2, netTopY - 30, 8, 130);
            
            // Net top rope
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(netX - netWidth / 2 - 8, netTopY);
            ctx.lineTo(netX + netWidth / 2 + 8, netTopY);
            ctx.stroke();
            
            // Net bottom rope
            ctx.beginPath();
            ctx.moveTo(netX - netWidth / 2 - 8, netBottomY);
            ctx.lineTo(netX + netWidth / 2 + 8, netBottomY);
            ctx.stroke();
            
            // Net mesh pattern
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.lineWidth = 1.5;
            
            // Vertical lines of net
            for (let i = 0; i <= 12; i++) {
                const xPos = (netX - netWidth / 2 - 5) + (i * 12);
                ctx.beginPath();
                ctx.moveTo(xPos, netTopY);
                ctx.lineTo(xPos, netBottomY);
                ctx.stroke();
            }
            
            // Horizontal lines of net (diagonal mesh effect)
            for (let i = 0; i <= 12; i++) {
                const yPos = netTopY + (i * 16);
                ctx.beginPath();
                ctx.moveTo(netX - netWidth / 2 - 5, yPos);
                ctx.lineTo(netX + netWidth / 2 + 5, yPos);
                ctx.stroke();
            }
            
            // Diagonal lines for mesh pattern
            for (let i = -5; i <= 20; i++) {
                ctx.beginPath();
                ctx.moveTo(netX - netWidth / 2 - 5 + i * 6, netTopY);
                ctx.lineTo(netX - netWidth / 2 - 5 + i * 6 + 120, netBottomY);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(netX - netWidth / 2 - 5 + i * 6, netTopY);
                ctx.lineTo(netX - netWidth / 2 - 5 + i * 6 - 120, netBottomY);
                ctx.stroke();
            }

            // Draw computer paddle (NPC on top side)
            ctx.fillStyle = '#FF6B6B';
            ctx.fillRect(computer.x, computer.y, computer.width, computer.height);
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 5;
            ctx.strokeStyle = '#C92A2A';
            ctx.lineWidth = 2;
            ctx.strokeRect(computer.x, computer.y, computer.width, computer.height);
            
            // Add player label on NPC paddle
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('NPC', computer.x + computer.width / 2, computer.y + computer.height / 2 + 3);
            ctx.shadowColor = 'transparent';

            // Draw player paddle (player on bottom side)
            ctx.fillStyle = '#4ECDC4';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 5;
            ctx.strokeStyle = '#1A9B99';
            ctx.lineWidth = 2;
            ctx.strokeRect(paddle.x, paddle.y, paddle.width, paddle.height);
            
            // Add player label on player paddle
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('JŪNEBAS', paddle.x + paddle.width / 2, paddle.y + paddle.height / 2 + 3);
            ctx.shadowColor = 'transparent';

            // Draw ball with gradient and shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.4)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 2;
            
            const ballGradient = ctx.createRadialGradient(ball.x - 4, ball.y - 4, 2, ball.x, ball.y, ball.radius);
            ballGradient.addColorStop(0, '#FFE66D');
            ballGradient.addColorStop(1, '#FFA500');
            ctx.fillStyle = ballGradient;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fill();

            // Draw ball stitches (volleyball detail)
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius - 3, 0, Math.PI * 2);
            ctx.stroke();
            
            // Draw curved stitches for volleyball pattern
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(ball.x, ball.y - 3, 5, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.shadowColor = 'transparent';

            // Draw starting instruction
            if (!gameStarted) {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 36px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('Klikšķis lai sāktu', canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = '20px Arial';
                ctx.fillText('🖱️ Pārvietojiet peli lai vadītu raketi', canvas.width / 2, canvas.height / 2 + 40);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Start the game loop
        gameLoop();
    </script>
</body>
</html>
